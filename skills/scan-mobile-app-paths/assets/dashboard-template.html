<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>应用路径地图</title>
  <style>
    :root{--bg:#f4f6f9;--panel:#fff;--line:#dfe4ec;--line-strong:#c8d0dc;--text:#172033;--muted:#687386;--subtle:#8d97a8;--blue:#2563eb;--blue-soft:#eaf1ff;--green:#159455;--green-soft:#e6f7ee;--purple:#7c3aed;--purple-soft:#f2eaff;--amber:#d97706;--amber-soft:#fff4dd;--red:#dc3545;--red-soft:#ffebee;--shadow:0 12px 30px rgba(30,42,64,.08);--radius:14px}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg)}button,input,select{font:inherit}button{cursor:pointer}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
    .topbar{height:68px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;background:#111827;color:#fff;border-bottom:1px solid #253047}.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,#4f8cff,#2855d9);display:grid;place-items:center;font-weight:800;letter-spacing:-1px}.brand h1{font-size:17px;margin:0}.brand p{font-size:12px;color:#aeb8ca;margin:3px 0 0}.top-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:#c9d1df}.status{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 10px;background:#243047}.status::before{content:"";width:7px;height:7px;border-radius:50%;background:#4ade80}.status.partial::before{background:#fbbf24}.status.bad::before{background:#fb7185}
    .page{padding:20px 24px 28px}.summary{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:12px;margin-bottom:16px}.metric{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-height:82px}.metric-label{font-size:12px;color:var(--muted)}.metric-value{font-size:25px;font-weight:720;letter-spacing:-.5px;margin-top:7px}.metric-note{font-size:11px;color:var(--subtle);margin-top:2px}
    .shell{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}.tabs{height:50px;border-bottom:1px solid var(--line);display:flex;align-items:end;padding:0 18px;gap:4px}.tab{border:0;background:transparent;color:var(--muted);height:49px;padding:0 16px;border-bottom:2px solid transparent;font-size:13px;font-weight:600}.tab.active{color:var(--blue);border-bottom-color:var(--blue)}.tab .count{margin-left:6px;background:#edf0f5;padding:2px 6px;border-radius:999px;color:var(--muted);font-size:10px}.tab.active .count{background:var(--blue-soft);color:var(--blue)}
    .view{display:none}.view.active{display:block}.map-layout{display:grid;grid-template-columns:230px minmax(400px,1fr) 320px;min-height:650px}.filters{border-right:1px solid var(--line);padding:18px;background:#fbfcfe}.section-title{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--subtle);margin:0 0 10px}.field{margin-bottom:15px}.field label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}.control{width:100%;border:1px solid var(--line-strong);border-radius:8px;background:#fff;padding:8px 10px;color:var(--text);font-size:12px;outline:none}.control:focus{border-color:#78a2ff;box-shadow:0 0 0 3px rgba(37,99,235,.1)}.range-row{display:flex;align-items:center;gap:8px}.range-row input{width:100%}.range-value{font-size:12px;color:var(--blue);min-width:20px;text-align:right}.legend{display:grid;gap:8px;margin-top:8px}.legend-row{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}.dot{width:10px;height:10px;border-radius:3px;background:var(--blue)}.dot.auth{background:var(--green)}.dot.modal{background:var(--purple)}.dash{width:20px;border-top:2px dashed var(--amber)}
    .map-panel{min-width:0;position:relative;background:#f8fafc}.map-toolbar{height:48px;border-bottom:1px solid var(--line);padding:0 14px;display:flex;align-items:center;justify-content:space-between;background:#fff}.map-title{font-size:12px;color:var(--muted)}.map-actions{display:flex;gap:6px}.icon-button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 9px;font-size:11px;color:var(--muted)}.icon-button:hover{border-color:var(--line-strong);color:var(--text)}.graph-wrap{height:600px;position:relative;overflow:hidden;background-image:radial-gradient(#d8dee8 1px,transparent 1px);background-size:20px 20px}.graph{width:100%;height:100%;display:block;touch-action:none}.empty{position:absolute;inset:0;display:none;place-items:center;color:var(--muted);font-size:13px}.empty.show{display:grid}.graph-node rect{fill:#fff;stroke:#b9c5d6;stroke-width:1.4}.graph-node:hover rect,.graph-node.selected rect{stroke:var(--blue);stroke-width:2}.graph-node.modal rect{fill:var(--purple-soft);stroke:#aa82e9}.graph-node.root rect{stroke:#5b86de}.graph-node text{pointer-events:none;fill:var(--text)}.graph-node .node-meta{fill:var(--muted);font-size:10px}.graph-edge{fill:none;stroke:#aab4c3;stroke-width:1.5;marker-end:url(#arrow)}.graph-edge.unstable{stroke:var(--amber);stroke-dasharray:5 4}.graph-edge-hit{fill:none;stroke:transparent;stroke-width:12;cursor:pointer}.graph-edge.selected{stroke:var(--blue);stroke-width:3}.edge-count{font-size:10px;fill:var(--muted);paint-order:stroke;stroke:#f8fafc;stroke-width:4px}
    .inspector{border-left:1px solid var(--line);background:#fff;min-width:0}.inspector-head{padding:18px;border-bottom:1px solid var(--line)}.inspector-head h2{font-size:16px;margin:6px 0}.inspector-head p{font-size:12px;color:var(--muted);margin:0;line-height:1.6}.eyebrow{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--subtle)}.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}.badge{font-size:10px;padding:3px 7px;border-radius:999px;background:#eef1f5;color:#556174}.badge.blue{background:var(--blue-soft);color:var(--blue)}.badge.green{background:var(--green-soft);color:var(--green)}.badge.purple{background:var(--purple-soft);color:var(--purple)}.badge.amber{background:var(--amber-soft);color:var(--amber)}.inspector-body{height:531px;overflow:auto;padding:16px 18px}.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}.info{border:1px solid var(--line);border-radius:9px;padding:9px}.info span{display:block;font-size:10px;color:var(--subtle)}.info strong{display:block;font-size:13px;margin-top:4px}.block{margin:0 0 18px}.block h3{font-size:12px;margin:0 0 9px}.list{display:grid;gap:7px}.list-item{border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:11px;color:var(--muted);line-height:1.5}.list-item strong{color:var(--text)}.step{display:flex;gap:8px}.step-index{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);font-size:10px;font-weight:700}.evidence{display:grid;grid-template-columns:1fr 1fr;gap:8px}.shot{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#f3f5f8}.shot img{display:block;width:100%;height:130px;object-fit:contain;background:#eef1f5}.shot span{display:block;padding:6px 7px;font-size:9px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .content-view{padding:22px;min-height:650px}.view-head{display:flex;align-items:start;justify-content:space-between;margin-bottom:18px}.view-head h2{margin:0;font-size:18px}.view-head p{margin:5px 0 0;color:var(--muted);font-size:12px}.diff-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.diff-card{border:1px solid var(--line);border-radius:12px;overflow:hidden}.diff-card-head{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font-size:12px;font-weight:700}.diff-card-body{padding:10px;display:grid;gap:7px}.screen-row{border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:12px;background:#fbfcfe}.missing{border:1px dashed var(--line-strong);border-radius:10px;padding:28px;color:var(--muted);font-size:12px;text-align:center}.issue-table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:11px;overflow:hidden}.issue-table th,.issue-table td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);font-size:11px;vertical-align:top}.issue-table th{background:#f7f9fb;color:var(--muted);font-weight:600}.issue-table tr:last-child td{border-bottom:0}.issue-json{max-width:760px;white-space:pre-wrap;word-break:break-word;color:var(--muted)}.footnote{margin-top:14px;border-left:3px solid var(--blue);background:var(--blue-soft);padding:10px 12px;font-size:11px;color:#38527f;line-height:1.6}.execution-summary{display:grid;grid-template-columns:repeat(6,minmax(100px,1fr));gap:10px;margin-bottom:18px}.execution-summary .metric{min-height:74px}.run-list{display:grid;gap:12px}.run-card{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}.run-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:14px 16px;border-bottom:1px solid var(--line);background:#fbfcfe}.run-title h3{font-size:13px;margin:0 0 5px}.run-title p{font-size:10px;color:var(--subtle);margin:0}.run-grid{display:grid;grid-template-columns:repeat(6,minmax(90px,1fr));gap:8px;padding:12px 16px}.run-grid .info{margin:0}.run-detail{border-top:1px solid var(--line);padding:0 16px 14px}.run-detail summary{padding:11px 0;font-size:11px;color:var(--blue);cursor:pointer}.badge.red{background:var(--red-soft);color:var(--red)}
    .footer{padding:14px 24px;color:var(--subtle);font-size:10px;display:flex;justify-content:space-between;gap:16px}.footer code{color:var(--muted)}
    @media(max-width:1200px){.summary{grid-template-columns:repeat(3,1fr)}.execution-summary,.run-grid{grid-template-columns:repeat(3,1fr)}.map-layout{grid-template-columns:210px 1fr}.inspector{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}.inspector-body{height:auto;max-height:420px}.graph-wrap{height:560px}}@media(max-width:760px){.page{padding:12px}.topbar{padding:0 14px}.top-meta span:not(.status){display:none}.summary,.execution-summary,.run-grid{grid-template-columns:repeat(2,1fr)}.map-layout{display:block}.filters{border-right:0;border-bottom:1px solid var(--line)}.graph-wrap{height:500px}.diff-grid{grid-template-columns:1fr}.run-head{display:block}.run-head .badges{margin-top:10px}.run-detail{overflow:auto}.footer{display:block}.footer span{display:block;margin-bottom:4px}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="brand-mark">路</div><div><h1>应用路径地图</h1><p id="app-subtitle">-</p></div></div>
    <div class="top-meta"><span id="version-label">-</span><span id="generation-label">-</span><span class="status" id="snapshot-status">-</span></div>
  </header>
  <main class="page">
    <section class="summary" id="summary"></section>
    <section class="shell">
      <nav class="tabs" aria-label="看板视图">
        <button class="tab active" data-view="map">路径地图</button>
        <button class="tab" data-view="execution">执行情况 <span class="count" id="execution-count">0</span></button>
        <button class="tab" data-view="auth">登录态差异</button>
        <button class="tab" data-view="issues">扫描问题 <span class="count" id="issue-count">0</span></button>
      </nav>
      <section class="view active" id="view-map">
        <div class="map-layout">
          <aside class="filters">
            <h2 class="section-title">地图筛选</h2>
            <div class="field"><label for="context-select">登录态</label><select class="control" id="context-select"></select></div>
            <div class="field"><label for="mode-select">展示粒度</label><select class="control" id="mode-select"><option value="logical">业务页面地图</option><option value="reachable">可达状态详细地图</option></select></div>
            <div class="field"><label for="search-input">页面搜索</label><input class="control" id="search-input" type="search" placeholder="输入页面名称"></div>
            <div class="field"><label for="kind-select">状态类型</label><select class="control" id="kind-select"><option value="all">全部</option><option value="full-screen">普通页面</option><option value="modal">业务弹窗</option><option value="mixed">混合状态</option></select></div>
            <div class="field"><label for="depth-range">最大路径深度</label><div class="range-row"><input id="depth-range" type="range" min="0" max="0" value="0"><span class="range-value" id="depth-value">0</span></div></div>
            <h2 class="section-title" style="margin-top:24px">图例</h2>
            <div class="legend"><div class="legend-row"><span class="dot"></span>未登录地图</div><div class="legend-row"><span class="dot auth"></span>已登录地图</div><div class="legend-row"><span class="dot modal"></span>业务弹窗</div><div class="legend-row"><span class="dash"></span>不稳定跳转</div></div>
          </aside>
          <section class="map-panel">
            <div class="map-toolbar"><span class="map-title" id="map-title">-</span><div class="map-actions"><button class="icon-button" id="fit-button">适应画布</button><button class="icon-button" id="reset-filter-button">重置筛选</button></div></div>
            <div class="graph-wrap" id="graph-wrap"><svg class="graph" id="graph" role="img" aria-label="应用路径地图"></svg><div class="empty" id="graph-empty">当前筛选没有可展示的状态</div></div>
          </section>
          <aside class="inspector"><div class="inspector-head" id="inspector-head"><span class="eyebrow">路径详情</span><h2>选择一个节点或跳转</h2><p>查看可达状态、规范路径、操作和截图证据。</p></div><div class="inspector-body" id="inspector-body"></div></aside>
        </div>
      </section>
      <section class="view" id="view-execution"><div class="content-view"><div class="view-head"><div><h2>执行情况</h2><p>当前地图快照所采用的扫描 Run、执行耗时和收敛指标。</p></div></div><div id="execution-content"></div></div></section>
      <section class="view" id="view-auth"><div class="content-view"><div class="view-head"><div><h2>登录态差异</h2><p>按业务页面语义对比未登录和已登录地图。</p></div></div><div id="auth-content"></div></div></section>
      <section class="view" id="view-issues"><div class="content-view"><div class="view-head"><div><h2>扫描问题</h2><p>地图快照的聚合冲突、缺失登录态和未解决项。</p></div></div><div id="issues-content"></div></div></section>
    </section>
  </main>
  <footer class="footer"><span id="snapshot-note">-</span><span><code id="manifest-hash">-</code></span></footer>
  <script id="dashboard-data" type="application/json">__SMAP_DASHBOARD_DATA__</script>
  <script>
  (()=>{
    'use strict';
    const data=JSON.parse(document.getElementById('dashboard-data').textContent);const NS='http://www.w3.org/2000/svg';
    const state={contextId:data.contexts[0]?.id||null,mode:'logical',search:'',kind:'all',maxDepth:0,selected:null,viewBox:null,drag:null};
    const $=id=>document.getElementById(id);const make=(tag,className,text)=>{const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=String(text);return node};const svg=(tag,attrs={})=>{const node=document.createElementNS(NS,tag);for(const [key,value]of Object.entries(attrs))node.setAttribute(key,String(value));return node};
    const formatDate=value=>{if(!value)return'-';const date=new Date(value);return Number.isNaN(date.getTime())?String(value):date.toLocaleString('zh-CN',{hour12:false})};
    const formatDuration=value=>{const ms=Number(value);if(!Number.isFinite(ms)||ms<0)return'-';if(ms<1000)return`${Math.round(ms)} 毫秒`;const seconds=Math.round(ms/1000);if(seconds<60)return`${seconds} 秒`;const minutes=Math.floor(seconds/60),rest=seconds%60;if(minutes<60)return`${minutes} 分 ${rest} 秒`;const hours=Math.floor(minutes/60);return`${hours} 小时 ${minutes%60} 分`};
    const currentContext=()=>data.contexts.find(item=>item.id===state.contextId)||data.contexts[0];const currentGraph=()=>state.mode==='logical'?currentContext()?.logicalGraph:currentContext()?.reachableGraph;
    function badge(text,tone){const node=make('span',`badge ${tone||''}`,text);return node}
    function setStatic(){const meta=data.meta;$('app-subtitle').textContent=`${meta.bundleName} · ${meta.environmentLabel} · ${meta.platformLabel}`;$('version-label').textContent=meta.buildVersion?`构建版本 ${meta.buildVersion}`:meta.appVersion?`应用版本 ${meta.appVersion}`:'版本未知';$('generation-label').textContent=meta.generationLabel;const status=$('snapshot-status');status.textContent=meta.snapshotStatusLabel;status.classList.toggle('partial',meta.snapshotStatus==='PARTIAL'||meta.snapshotStatus==='VERSION_UNKNOWN');status.classList.toggle('bad',!['READY','PARTIAL','VERSION_UNKNOWN'].includes(meta.snapshotStatus));$('issue-count').textContent=data.overview.unresolvedCount;$('snapshot-note').textContent=`地图快照生成于 ${formatDate(meta.snapshotGeneratedAt)} · ${data.semantics.coverage}`;$('manifest-hash').textContent=meta.sourceManifestSha256;
      const metrics=[['业务页面',data.overview.logicalScreens,'按产品语义聚合'],['可达状态',data.overview.reachableStates,'包含进入方式'],['已发现跳转',data.overview.edges,'稳定观察到的转换'],['冷启动已验证',data.overview.verifiedEdges,'规范路径验证通过'],['重放不稳定',data.overview.unstableEdges,'需要检查或重扫'],['规范路径',data.overview.canonicalPaths,'每个可达状态'],['未解决项',data.overview.unresolvedCount,data.overview.unresolvedCount?'需要检查':'当前无冲突']];const root=$('summary');root.replaceChildren(...metrics.map(([label,value,note])=>{const box=make('article','metric');box.append(make('div','metric-label',label),make('div','metric-value',value),make('div','metric-note',note));return box}));
      const select=$('context-select');select.replaceChildren(...data.contexts.map(context=>{const option=make('option',null,`${context.label} · ${context.summary.logicalScreens} 页`);option.value=context.id;return option}));select.value=state.contextId;$('execution-count').textContent=data.execution?.runs?.length||0;updateDepth();renderExecution();renderAuth();renderIssues();
    }
    function updateDepth(){const context=currentContext();state.maxDepth=context?.summary.maxDepth||0;const range=$('depth-range');range.max=String(state.maxDepth);range.value=String(state.maxDepth);$('depth-value').textContent=state.maxDepth}
    function filtered(){const graph=currentGraph();if(!graph)return{nodes:[],edges:[]};const query=state.search.trim().toLowerCase();const max=Number($('depth-range').value);const nodes=graph.nodes.filter(node=>(node.depth||0)<=max&&(!query||String(node.label).toLowerCase().includes(query)||String(node.description||'').toLowerCase().includes(query))&&(state.kind==='all'||node.kind===state.kind||(node.kinds||[]).includes(state.kind)));const ids=new Set(nodes.map(node=>node.id));return{nodes,edges:graph.edges.filter(edge=>ids.has(edge.from)&&ids.has(edge.to))}}
    function edgePath(from,to,self){if(self)return`M ${from.x+80} ${from.y} C ${from.x+150} ${from.y-70}, ${from.x+150} ${from.y+70}, ${from.x+80} ${from.y+8}`;const sx=from.x+80,sy=from.y,tx=to.x-80,ty=to.y,mid=(sx+tx)/2;return`M ${sx} ${sy} C ${mid} ${sy}, ${mid} ${ty}, ${tx} ${ty}`}
    function layout(nodes){const layers=new Map();for(const node of nodes){const depth=Math.max(0,Number(node.depth)||0);if(!layers.has(depth))layers.set(depth,[]);layers.get(depth).push(node)}const positions=new Map();let maxRows=1,maxDepth=0;for(const [depth,items]of layers){items.sort((a,b)=>String(a.label).localeCompare(String(b.label),'zh-CN'));maxRows=Math.max(maxRows,items.length);maxDepth=Math.max(maxDepth,depth);items.forEach((node,index)=>positions.set(node.id,{x:130+depth*260,y:90+index*110}))}return{positions,width:Math.max(760,260*(maxDepth+1)+100),height:Math.max(560,maxRows*110+80)}}
    function renderGraph(){const context=currentContext();const graphData=filtered();const graph=$('graph');graph.replaceChildren();$('graph-empty').classList.toggle('show',!graphData.nodes.length);$('map-title').textContent=`${context?.label||'-'} · ${state.mode==='logical'?'业务页面':'可达状态'} · ${graphData.nodes.length} 节点 / ${graphData.edges.length} 边`;if(!graphData.nodes.length)return;const placed=layout(graphData.nodes);state.viewBox={x:0,y:0,w:placed.width,h:placed.height};applyViewBox();const defs=svg('defs');const marker=svg('marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'});marker.append(svg('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#aab4c3'}));defs.append(marker);graph.append(defs);const edgeLayer=svg('g');const nodeLayer=svg('g');graph.append(edgeLayer,nodeLayer);
      for(const edge of graphData.edges){const from=placed.positions.get(edge.from),to=placed.positions.get(edge.to);if(!from||!to)continue;const d=edgePath(from,to,edge.from===edge.to);const visible=svg('path',{d,class:`graph-edge ${edge.replayability==='UNSTABLE'?'unstable':''} ${state.selected?.type==='edge'&&state.selected.id===edge.id?'selected':''}`});const hit=svg('path',{d,class:'graph-edge-hit'});hit.addEventListener('click',event=>{event.stopPropagation();state.selected={type:'edge',id:edge.id};renderInspector();renderGraph()});edgeLayer.append(visible,hit);if(edge.count>1){const label=svg('text',{x:(from.x+to.x)/2,y:(from.y+to.y)/2-6,class:'edge-count'});label.textContent=`${edge.count} 条`;edgeLayer.append(label)}}
      const contextTone=context?.id==='authenticated'?'green':'blue';for(const node of graphData.nodes){const point=placed.positions.get(node.id);const group=svg('g',{class:`graph-node ${node.kind==='modal'?'modal':''} ${node.root?'root':''} ${state.selected?.type==='node'&&state.selected.id===node.id?'selected':''}`,transform:`translate(${point.x},${point.y})`,tabindex:'0',role:'button'});group.append(svg('rect',{x:-80,y:-34,width:160,height:68,rx:10}));const title=svg('text',{x:-66,y:-5,'font-size':12,'font-weight':650});title.textContent=String(node.label).length>18?`${String(node.label).slice(0,17)}…`:node.label;const meta=svg('text',{x:-66,y:15,class:'node-meta'});meta.textContent=`深度 ${node.depth||0} · ${node.kind==='modal'?'业务弹窗':node.root?'根状态':state.mode==='logical'?`${node.reachableStateCount}个可达态`:'可达状态'}`;const accent=svg('rect',{x:-80,y:-34,width:5,height:68,rx:3,fill:node.kind==='modal'?'#7c3aed':contextTone==='green'?'#159455':'#2563eb',stroke:'none'});group.append(title,meta,accent);const select=event=>{event.stopPropagation();state.selected={type:'node',id:node.id};renderInspector();renderGraph()};group.addEventListener('click',select);group.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();select(event)}});nodeLayer.append(group)}
    }
    function applyViewBox(){if(state.viewBox)$('graph').setAttribute('viewBox',`${state.viewBox.x} ${state.viewBox.y} ${state.viewBox.w} ${state.viewBox.h}`)}
    function info(label,value){const box=make('div','info');box.append(make('span',null,label),make('strong',null,value));return box}
    function imageCard(item,label){const link=document.createElement('a');link.className='shot';link.href=item.screenshotUrl;link.target='_blank';link.rel='noreferrer';const image=document.createElement('img');image.src=item.screenshotUrl;image.alt=`${label} ${item.observationId}`;const text=make('span',null,`${label} · ${item.observationId}`);link.append(image,text);return link}
    function renderInspector(){const context=currentContext();const graph=currentGraph();const head=$('inspector-head'),body=$('inspector-body');body.replaceChildren();if(!state.selected){head.replaceChildren(make('span','eyebrow','路径详情'),make('h2',null,'选择一个节点或跳转'),make('p',null,'查看可达状态、规范路径、操作和截图证据。'));return}if(state.selected.type==='node'){const node=graph.nodes.find(item=>item.id===state.selected.id);if(!node){state.selected=null;return renderInspector()}const badges=make('div','badges');badges.append(badge(context.label,context.id==='authenticated'?'green':'blue'),badge(node.kindLabel,node.kind==='modal'?'purple':''));if(node.root)badges.append(badge('根状态'));head.replaceChildren(make('span','eyebrow',state.mode==='logical'?'业务页面':'可达状态'),make('h2',null,node.label),make('p',null,node.description||node.id),badges);const grid=make('div','info-grid');grid.append(info('路径深度',node.depth||0),info('入边',node.incomingEdgeIds?.length||0),info('出边',node.outgoingEdgeIds?.length||0),info(state.mode==='logical'?'可达状态':'弹窗深度',state.mode==='logical'?node.reachableStateCount:node.modalDepth||0));body.append(grid);const terminalPaths=context.paths.filter(item=>state.mode==='logical'?item.terminalLogicalScreenId===node.id:item.terminalReachableStateId===node.id);const pathBlock=make('section','block');pathBlock.append(make('h3',null,'规范重放路径'));const list=make('div','list');if(!terminalPaths.length)list.append(make('div','list-item',node.root?'根状态不需要重放动作。':'当前没有规范重放路径。'));for(const pathItem of terminalPaths){const item=make('div','list-item');item.append(make('strong',null,`${pathItem.steps.length} 步 · ${pathItem.terminalLabel}`));pathItem.steps.forEach((step,index)=>{const row=make('div','step');row.style.marginTop='7px';row.append(make('span','step-index',index+1),make('span',null,`${step.label} · ${step.replayStatusLabel||step.replayabilityLabel}`));item.append(row)});list.append(item)}pathBlock.append(list);body.append(pathBlock);const incoming=graph.edges.filter(edge=>node.in ck');block.append(make('h3',null,'前后证据'));const shots=make('div','evidence');if(edge.evidence.before)shots.append(imageCard(edge.evidence.before,'操作前'));if(edge.evidence.after)shots.append(imageCard(edge.evidence.after,'操作后'));block.append(shots);body.append(block)}}
    }
    function renderAuth(){const root=$('auth-content');root.replaceChildren();const diff=data.authDiff;if(diff.status!=='READY'){const missing=make('div','missing',`暂无完整差异数据，状态：${diff.statusLabel}；缺少：${(diff.missingContextLabels||[]).join('、')||'-'}`);root.append(missing);return}const grid=make('div','diff-grid');for(const [title,items,tone]of [['共有页面',diff.common,'blue'],['仅未登录',diff.guestOnly,''],['仅已登录',diff.authenticatedOnly,'green']]){const card=make('article','diff-card');const head=make('div','diff-card-head');head.append(make('span',null,title),badge(items.length,tone));const body=make('div','diff-card-body');if(items.length)items.forEach(item=>body.append(make('div','screen-row',item.name)));else body.append(make('div','missing','无记录'));card.append(head,body);grid.append(card)}root.append(grid,make('div','footnote',data.semantics.paths))}
    function renderExecution(){const root=$('execution-content');root.replaceChildren();const execution=data.execution||{totals:{frontier:{}},runs:[]},totals=execution.totals||{},frontier=totals.frontier||{};const summary=make('div','execution-summary');for(const [title,value,note]of [['来源 Run',totals.runCount||execution.runs.length,'当前快照采用'],['自动扫描耗时',formatDuration(totals.activeDurationMs),'不含人工暂停'],['动作',totals.actions||0,`探索 ${totals.explorationActions||0} · 导航 ${totals.navigationActions||0} · 验证 ${totals.verificationActions||0}`],['正式观测',totals.observations||0,`${totals.observationSamples||0} 次采样`],['冷启动',totals.coldStarts||0,`Cursor 复用 ${totals.cursorReuseHits||0} 次`],['待续候选',frontier.open||0,'待处理或可重试']]){const box=make('article','metric');box.append(make('div','metric-label',title),make('div','metric-value',value),make('div','metric-note',note));summary.append(box)}root.append(summary);const list=make('div','run-list');if(!execution.runs.length)list.append(make('div','missing','当前 Snapshot 没有可展示的来源 Run 执行指标。'));for(const run of execution.runs){const card=make('article','run-card');const head=make('div','run-head'),title=make('div','run-title');title.append(make('h3',null,run.scanId),make('p',null,`开始 ${formatDate(run.startedAt)} · 完成 ${formatDate(run.finalizedAt)} · 墙钟 ${formatDuration(run.wallDurationMs)}`));const badges=make('div','badges'),tone=run.status==='COMPLETED'?'green':run.status==='PARTIAL'?'amber':'red';badges.append(badge(run.statusLabel,tone),badge(run.scanModeLabel,'blue'),badge(run.profileLabel));head.append(title,badges);card.append(head);const grid=make('div','run-grid');for(const [name,value]of [['登录态',(run.contextLabels||[]).join('、')||'-'],['自动扫描',formatDuration(run.totals.activeDurationMs)],['动作',run.totals.actions||0],['观测',run.totals.observations||0],['冷启动',run.totals.coldStarts||0],['Cursor 复用',run.totals.cursorReuseHits||0]])grid.append(info(name,value));card.append(grid);const details=make('details','run-detail'),detailHead=make('summary',null,'查看登录态执行明细'),table=make('table','issue-table'),thead=document.createElement('thead'),headerRow=document.createElement('tr');['登录态','活动耗时','动作','观测/采样','Restore','无状态变化','已探索','待续'].forEach(text=>headerRow.append(make('th',null,text)));thead.append(headerRow);const tbody=document.createElement('tbody');for(const context of run.contexts||[]){const row=document.createElement('tr');row.append(make('td',null,context.contextLabel),make('td',null,formatDuration(context.activeDurationMs)),make('td',null,context.actions||0),make('td',null,`${context.observations||0} / ${context.observationSamples||0}`),make('td',null,context.restoreAttempts||0),make('td',null,context.noStateChangeActions||0),make('td',null,(context.frontier?.explored||0)+(context.frontier?.coveredByGroup||0)),make('td',null,context.frontier?.open||0));tbody.append(row)}table.append(thead,tbody);details.append(detailHead,table);card.append(details);list.append(card)}root.append(list,make('div','footnote',data.semantics.execution))}
    function renderIssues(){const root=$('issues-content');root.replaceChildren();if(!data.unresolved.length){root.append(make('div','missing','当前地图快照没有未解决的聚合冲突。'));return}const table=make('table','issue-table');const thead=document.createElement('thead'),tr=document.createElement('tr');['#','类型','登录态','详情'].forEach(text=>tr.append(make('th',null,text)));thead.append(tr);const tbody=document.createElement('tbody');data.unresolved.forEach((item,index)=>{const row=document.createElement('tr');row.append(make('td',null,index+1),make('td',null,item.typeLabel),make('td',null,item.contextLabel),make('td','issue-json',item.summary));tbody.append(row)});table.append(thead,tbody);root.append(table)}
    function resetFilters(){state.search='';state.kind='all';$('search-input').value='';$('kind-select').value='all';updateDepth();state.selected=null;renderInspector();renderGraph()}
    document.querySelectorAll('.tab').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(item=>item.classList.toggle('active',item===button));document.querySelectorAll('.view').forEach(view=>view.classList.toggle('active',view.id===`view-${button.dataset.view}`));if(button.dataset.view==='map')setTimeout(renderGraph,0)}));
    $('context-select').addEventListener('change',event=>{state.contextId=event.target.value;state.selected=null;updateDepth();renderInspector();renderGraph()});$('mode-select').addEventListener('change',event=>{state.mode=event.target.value;state.selected=null;renderInspector();renderGraph()});$('search-input').addEventListener('input',event=>{state.search=event.target.value;renderGraph()});$('kind-select').addEventListener('change',event=>{state.kind=event.target.value;renderGraph()});$('depth-range').addEventListener('input',event=>{$('depth-value').textContent=event.target.value;renderGraph()});$('reset-filter-button').addEventListener('click',resetFilters);$('fit-button').addEventListener('click',renderGraph);
    const graph=$('graph');graph.addEventListener('wheel',event=>{event.preventDefault();if(!state.viewBox)return;const factor=event.deltaY>0?1.12:.88;const nextW=Math.max(280,Math.min(5000,state.viewBox.w*factor)),nextH=Math.max(220,Math.min(4000,state.viewBox.h*factor));state.viewBox.x+=(state.viewBox.w-nextW)/2;state.viewBox.y+=(state.viewBox.h-nextH)/2;state.viewBox.w=nextW;state.viewBox.h=nextH;applyViewBox()},{passive:false});graph.addEventListener('pointerdown',event=>{if(event.target===graph||event.target.tagName==='svg')state.drag={x:event.clientX,y:event.clientY,box:{...state.viewBox}}});graph.addEventListener('pointermove',event=>{if(!state.drag||!state.viewBox)return;const rect=graph.getBoundingClientRect();state.viewBox.x=state.drag.box.x-(event.clientX-state.drag.x)*state.drag.box.w/rect.width;state.viewBox.y=state.drag.box.y-(event.clientY-state.drag.y)*state.drag.box.h/rect.height;applyViewBox()});window.addEventListener('pointerup',()=>{state.drag=null});
    setStatic();renderInspector();renderGraph();
