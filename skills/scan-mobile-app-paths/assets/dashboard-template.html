<body>
  <header class="topbar">
    <div class="brand"><div class="brand-mark">路</div><div><h1>应用路径地图</h1><p id="app-subtitle">-</p></div></div>
    <div class="top-meta"><span id="version-label">-</span><span id="generation-label">-</span><span class="status" id="snapshot-status">-</span></div>
  </header>
  <main class="page">
    <section class="summary" id="summary"></section>
    <section class="shell">
      <nav class="tabs" aria-label="看板视图">
        <button class="tab active" data-view="map">路径地图</button>
        <button class="tab" data-view="execution">扫描执行 <span class="count" id="execution-count">0</span></button>
        <button class="tab" data-view="auth">登录态差异</button>
        <button class="tab" data-view="issues">问题队列 <span class="count" id="issue-count">0</span></button>
      </nav>
      <section class="view active" id="view-map">
        <div class="map-layout">
          <aside class="filters">
            <h2 class="section-title">地图筛选</h2>
            <div class="field"><label for="context-select">登录态</label><select class="control" id="context-select"></select></div>
            <div class="field"><label for="mode-select">展示粒度</label><select class="control" id="mode-select"><option value="logical">业务页面地图</option><option value="reachable">可达状态详细地图</option></select></div>
            <div class="field" id="self-loop-field"><label class="check-row"><input id="hide-self-loops" type="checkbox" checked><span>隐藏业务页面自环</span></label></div>
            <div class="field"><label class="check-row"><input id="shortest-paths-only" type="checkbox" checked><span>仅显示到当前节点的最短路径边</span></label></div>
            <div class="field"><label for="search-input">页面搜索</label><input class="control" id="search-input" type="search" placeholder="输入页面名称"></div>
            <div class="field"><label for="kind-select">状态类型</label><select class="control" id="kind-select"><option value="all">全部</option><option value="full-screen">普通页面</option><option value="modal">业务弹窗</option><option value="mixed">混合状态</option></select></div>
            <div class="field"><label for="depth-range">最大路径深度</label><div class="range-row"><input id="depth-range" type="range" min="0" max="0" value="0"><span class="range-value" id="depth-value">0</span></div></div>
            <h2 class="section-title" style="margin-top:24px">图例</h2>
            <div class="legend"><div class="legend-row"><span class="dot"></span>未登录地图</div><div class="legend-row"><span class="dot auth"></span>已登录地图</div><div class="legend-row"><span class="dot modal"></span>业务弹窗</div><div class="legend-row"><span class="edge-sample verified"></span>冷启动已验证</div><div class="legend-row"><span class="edge-sample unverified"></span>未验证</div><div class="legend-row"><span class="edge-sample unstable"></span>重放不稳定</div><div class="legend-row"><span class="edge-sample invalidated"></span>验证已失效</div></div>
          </aside>
          <section class="map-panel">
            <div class="map-toolbar"><span class="map-title" id="map-title">-</span><div class="map-actions"><button class="icon-button" id="fit-button">适应画布</button><button class="icon-button" id="reset-filter-button">重置筛选</button></div></div>
            <div class="graph-wrap" id="graph-wrap"><svg class="graph" id="graph" role="img" aria-label="应用路径地图"></svg><div class="empty" id="graph-empty">当前筛选没有可展示的状态</div></div>
          </section>
          <aside class="inspector"><div class="inspector-head" id="inspector-head"><span class="eyebrow">路径详情</span><h2>选择一个节点或跳转</h2><p>查看可达状态、规范路径、操作和截图证据。</p></div><div class="inspector-body" id="inspector-body"></div></aside>
        </div>
      </section>
      <section class="view" id="view-execution"><div class="content-view"><div class="view-head"><div><h2>扫描执行</h2><p>当前地图快照所采用的扫描 Run、执行耗时和收敛指标。</p></div></div><div id="execution-content"></div></div></section>
      <section class="view" id="view-auth"><div class="content-view"><div class="view-head"><div><h2>登录态差异</h2><p>按业务页面语义对比未登录和已登录地图。</p></div></div><div id="auth-content"></div></div></section>
      <section class="view" id="view-issues"><div class="content-view"><div class="view-head"><div><h2>问题队列</h2><p>地图快照的聚合冲突、缺失登录态和未解决项。</p></div></div><div id="issues-content"></div></div></section>
    </section>
  </main>
  <footer class="footer"><span id="snapshot-note">-</span><span><code id="manifest-hash">-</code></span></footer>
  <script id="dashboard-data" type="application/json">__SMAP_DASHBOARD_DATA__</script>
  <script>
  (()=>{

    const $=id=>document.getElementById(id);const make=(tag,className,text)=>{const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=String(text);return node};const svg=(tag,attrs={})=>{const node=document.createElementNS(NS,tag);for(const [key,value]of Object.entries(attrs))node.setAttribute(key,String(value));return node};
    const formatDate=value=>{if(!value)return'-';const date=new Date(value);return Number.isNaN(date.getTime())?String(value):date.toLocaleString('zh-CN',{hour12:false})};

    const currentContext=()=>data.contexts.find(item=>item.id===state.contextId)||data.contexts[0];const currentGraph=()=>state.mode==='logical'?currentContext()?.logicalGraph:currentContext()?.reachableGraph;

      const metrics=[['业务页面',data.overview.logicalScreens,'按产品语义聚合'],['可达状态',data.overview.reachableStates,'包含进入方式'],['已发现跳转',data.overview.edges,'稳定观察到的转换'],['冷启动已验证',data.overview.verifiedEdges,'规范路径验证通过'],['重放不稳定',data.overview.unstableEdges,'需要检查或重扫'],['规范路径',data.overview.canonicalPaths,'每个可达状态'],['未解决项',data.overview.unresolvedCount,data.overview.unresolvedCount?'需要检查':'当前无冲突']];const root=$('summary');root.replaceChildren(...metrics.map(([label,value,note])=>{const box=make('article','metric');box.append(make('div','metric-label',label),make('div','metric-value',value),make('div','metric-note',note));return box}));
      const select=$('context-select');select.replaceChildren(...data.contexts.map(context=>{const option=make('option',null,`${context.label} · ${context.summary.logicalScreens} 页`);option.value=context.id;return option}));select.value=state.contextId;$('execution-count').textContent=data.execution?.runs?.length||0;updateDepth();updateModeControls();renderExecution();renderAuth();renderIssues();
    }
    function updateDepth(){const context=currentContext();state.maxDepth=context?.summary.maxDepth||0;const range=$('depth-range');range.max=String(state.maxDepth);range.value=String(state.maxDepth);$('depth-value').textContent=state.maxDepth}
    function updateModeControls(){const disabled=state.mode!=='logical',field=$('self-loop-field'),control=$('hide-self-loops');control.disabled=disabled;field.classList.toggle('disabled',disabled);field.title=disabled?'自环隐藏只适用于业务页面地图':'隐藏聚合后的业务页面自环边'}
    function hiddenLogicalSelfEdgeIds(context=currentContext()){if(state.mode!=='logical'||!state.hideLogicalSelfLoops)return new Set();const ids=new Set();for(const edge of context?.logicalGraph?.edges||[])if(edge.from===edge.to){ids.add(edge.id);for(const id of edge.edgeIds||[])ids.add(id)}return ids}
    function shortestPathEdgeIds(context,nodes){if(!state.shortestPathsOnly)return null;const hiddenEdges=hiddenLogicalSelfEdgeIds(context),nodeIds=new Set(nodes.map(node=>node.id)),allowed=new Set();if(state.mode==='logical'){const rawToLogical=new Map();for(const logicalEdge of context?.logicalGraph?.edges||[])for(const id of logicalEdge.edgeIds||[])rawToLogical.set(id,logicalEdge);const sorted=nodes.slice().sort((a,b)=>(a.depth||0)-(b.depth||0)||String(a.label).localeCompare(String(b.label),'zh-CN')||String(a.id).localeCompare(String(b.id)));for(const node of sorted){const paths=context.paths.filter(item=>item.terminalLogicalScreenId===node.id);for(const path of visiblePaths(paths)){const ids=(path.edgeIds||[]).filter(id=>!hiddenEdges.has(id));for(let index=ids.length-1;index>=0;index-=1){const logicalEdge=rawToLogical.get(ids[index]);if(logicalEdge&&logicalEdge.to===node.id&&(!state.hideLogicalSelfLoops||logicalEdge.from!==logicalEdge.to)){allowed.add(ids[index]);break}}}}return allowed}for(const nodeId of nodeIds){const paths=context.paths.filter(item=>item.terminalReachableStateId===nodeId&&!(item.edgeIds||[]).some(id=>hiddenEdges.has(id)));for(const path of visiblePaths(paths))for(const id of path.edgeIds||[])allowed.add(id)}return allowed}
    function edgeInShortestPaths(edge,allowed){if(!allowed)return true;return allowed.has(edge.id)||(edge.edgeIds||[]).some(id=>allowed.has(id))}
    function edgeForShortestPaths(edge,allowed){if(!allowed||state.mode!=='logical'||!(edge.edgeIds||[]).length)return edge;const edgeIds=edge.edgeIds.filter(id=>allowed.has(id));return edgeIds.length?{...edge,edgeIds,count:edgeIds.length}:null}
    function filtered(){const graph=currentGraph();if(!graph)return{nodes:[],edges:[]};const context=currentContext(),query=state.search.trim().toLowerCase();const max=Number($('depth-range').value);const nodes=graph.nodes.filter(node=>(node.depth||0)<=max&&(!query||String(node.label).toLowerCase().includes(query)||String(node.description||'').toLowerCase().includes(query))&&(state.kind==='all'||node.kind===state.kind||(node.kinds||[]).includes(state.kind)));const ids=new Set(nodes.map(node=>node.id)),hiddenEdges=hiddenLogicalSelfEdgeIds(context),shortestEdges=shortestPathEdgeIds(context,nodes);let edges=graph.edges.filter(edge=>ids.has(edge.from)&&ids.has(edge.to)&&edgeInShortestPaths(edge,shortestEdges)).map(edge=>edgeForShortestPaths(edge,shortestEdges)).filter(Boolean);if(hiddenEdges.size)edges=edges.filter(edge=>!hiddenEdges.has(edge.id)&&!(edge.edgeIds||[]).some(id=>hiddenEdges.has(id)));return{nodes,edges}}
    const NODE_W=160,NODE_H=68,LAYER_GAP=300,ROW_GAP=118,LEFT_PAD=140,TOP_PAD=96;
    function edgeSides(from,to,self){if(self)return{from:'right',to:'right'};const dx=to.x-from.x,dy=to.y-from.y;if(Math.abs(dx)<1)return dy>=0?{from:'right',to:'right'}:{from:'left',to:'left'};return dx>=0?{from:'right',to:'left'}:{from:'left',to:'right'}}
    function edgePorts(edges,positions){const groups=new Map(),ports=new Map(),horizontal=side=>side==='left'||side==='right';for(const edge of edges){const from=positions.get(edge.from),to=positions.get(edge.to);if(!from||!to)continue;const sides=edgeSides(from,to,edge.from===edge.to),items=[['from',edge.from,sides.from,to],['to',edge.to,sides.to,from]];for(const [role,nodeId,side,other]of items){const groupKey=`${nodeId}:${side}`;if(!groups.has(groupKey))groups.set(groupKey,[]);groups.get(groupKey).push({key:`${edge.id}:${role}`,side,sort:horizontal(side)?other.y:other.x,edgeId:edge.id,role})}}for(const group of groups.values()){group.sort((a,b)=>a.sort-b.sort||String(a.edgeId).localeCompare(String(b.edgeId))||a.role.localeCompare(b.role));const step=18;group.forEach((item,index)=>ports.set(item.key,{side:item.side,offset:(index-(group.length-1)/2)*step}))}return ports}
    function edgePoint(node,port){const halfW=NODE_W/2,halfH=NODE_H/2,gap=12,offset=port?.offset||0,side=port?.side||'right';if(side==='left')return{x:node.x-halfW-gap,y:node.y+offset,side};if(side==='right')return{x:node.x+halfW+gap,y:node.y+offset,side};if(side==='top')return{x:node.x+offset,y:node.y-halfH-gap,side};return{x:node.x+offset,y:node.y+halfH+gap,side}}

    function edgePath(from,to,self,fromPort,toPort,route){if(self){const point=edgePoint(from,fromPort),side=18+Math.abs(fromPort?.offset||0);return`M ${point.x} ${point.y-16} C ${point.x+76+side} ${point.y-58}, ${point.x+76+side} ${point.y+58}, ${point.x} ${point.y+16}`}const start=edgePoint(from,fromPort),end=edgePoint(to,toPort);if(route?.sameLayer){const x=route.x;return`M ${start.x} ${start.y} L ${x} ${start.y} L ${x} ${end.y} L ${end.x} ${end.y}`}if(route?.outer){const a=edgeExit(start),b=edgeExit(end),y=route.y;return`M ${start.x} ${start.y} L ${a.x} ${a.y} L ${a.x} ${y} L ${b.x} ${y} L ${b.x} ${b.y} L ${end.x} ${end.y}`}const midX=(start.x+end.x)/2;return`M ${start.x} ${start.y} L ${midX} ${start.y} L ${midX} ${end.y} L ${end.x} ${end.y}`}
    function edgeLabelPoint(from,to,fromPort,toPort,route){if(route?.sameLayer)return{x:route.x,y:(from.y+to.y)/2-6};if(route?.outer)return{x:(from.x+to.x)/2,y:route.y-6};const start=edgePoint(from,fromPort),end=edgePoint(to,toPort);return{x:(start.x+end.x)/2,y:(start.y+end.y)/2-6}}
    function layout(nodes,edges=[]){const layerMap=new Map();for(const node of nodes){const depth=Math.max(0,Number(node.depth)||0);if(!layerMap.has(depth))layerMap.set(depth,[]);layerMap.get(depth).push(node)}const layers=[...layerMap.entries()].sort((a,b)=>a[0]-b[0]).map(([depth,items])=>({depth,items:items.slice().sort((a,b)=>(b.root===true)-(a.root===true)||String(a.label).localeCompare(String(b.label),'zh-CN'))}));const layerIndexById=new Map(),order=new Map();const syncOrder=()=>{layers.forEach((layer,layerIndex)=>layer.items.forEach((node,index)=>{layerIndexById.set(node.id,layerIndex);order.set(node.id,index)}))};const neighborRank=(node,direction)=>{let total=0,count=0;for(const edge of edges){if(edge.from===edge.to)continue;const other=direction==='in'&&edge.to===node.id?edge.from:direction==='out'&&edge.from===node.id?edge.to:null;if(other==null||!order.has(other))continue;const otherLayer=layerIndexById.get(other),thisLayer=layerIndexById.get(node.id);if(direction==='in'&&otherLayer>=thisLayer||direction==='out'&&otherLayer<=thisLayer)continue;total+=order.get(other);count+=1}return count?total/count:null};const sortLayer=(items,direction)=>items.sort((a,b)=>{const ar=neighborRank(a,direction),br=neighborRank(b,direction);if(ar!=null&&br!=null&&ar!==br)return ar-br;if(ar!=null&&br==null)return-1;if(ar==null&&br!=null)return 1;return(order.get(a.id)??0)-(order.get(b.id)??0)||String(a.label).localeCompare(String(b.label),'zh-CN')});syncOrder();for(let pass=0;pass<6;pass+=1){for(let index=1;index<layers.length;index+=1){sortLayer(layers[index].items,'in');syncOrder()}for(let index=layers.length-2;index>=0;index-=1){sortLayer(layers[index].items,'out');syncOrder()}}const positions=new Map();let maxRows=1;for(const layer of layers)maxRows=Math.max(maxRows,layer.items.length);const height=Math.max(560,TOP_PAD*2+(maxRows-1)*ROW_GAP+NODE_H);layers.forEach((layer,layerIndex)=>{const y0=TOP_PAD+(maxRows-layer.items.length)*ROW_GAP/2;layer.items.forEach((node,index
